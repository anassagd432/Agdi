# ────────────────────────────────────────────────────────────────────────────
#  Agdi Production Stack
#
#  Usage:
#    1. Create .env.prod with production secrets
#    2. docker compose -f docker-compose.prod.yml up -d --build
#
#  IMPORTANT: Set AGDI_GATEWAY_TOKEN to a strong random string:
#    openssl rand -hex 32
# ────────────────────────────────────────────────────────────────────────────

name: agdi-prod

services:

  # ── Agdi Gateway ───────────────────────────────────────────────────────────
  agdi-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      HOME: /home/node
      NODE_ENV: production
    volumes:
      - agdi-config:/home/node/.agdi
      - agdi-workspace:/home/node/.agdi/workspace
    ports:
      - "18789:18789"
    init: true
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:18789/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    networks:
      - agdi-net
    deploy:
      resources:
        limits:
          memory: 2G

  # ── Agdi Dashboard (Next.js) ───────────────────────────────────────────────
  agdi-dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WS_URL: "ws://agdi-gateway:18789/ws"
      NEXT_PUBLIC_GATEWAY_TOKEN: "${AGDI_GATEWAY_TOKEN}"
    ports:
      - "3000:3000"
    depends_on:
      agdi-gateway:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - agdi-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── n8n Workflow Automation ────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_USER:-admin}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_PASSWORD}"
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      N8N_HOST: "0.0.0.0"
      GENERIC_TIMEZONE: "${TZ:-UTC}"
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    restart: always
    networks:
      - agdi-net
    deploy:
      resources:
        limits:
          memory: 1G

# ── Named volumes ──────────────────────────────────────────────────────────
volumes:
  agdi-config:
  agdi-workspace:
  n8n-data:

# ── Network ────────────────────────────────────────────────────────────────
networks:
  agdi-net:
    driver: bridge
