name: Feature request
description: Suggest a capability or change for Agdi
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are not commitments. See
        [GOVERNANCE.md](https://github.com/anassagd432/Agdi/blob/main/GOVERNANCE.md)
        for how decisions are made, and
        [SUPPORT.md](https://github.com/anassagd432/Agdi/blob/main/SUPPORT.md) for what
        this project does and does not promise.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen, and which surface it affects (CLI, gateway, plugin SDK, channel, docs).
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Gateway
        - Channel plugin
        - Provider plugin
        - Plugin SDK
        - Workspace UI
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing features you tried.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps explain the request. Remove secrets before pasting logs or configuration.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I understand that accepting this request is not guaranteed and no timeline is promised.
          required: true
