services:
  agdi-gateway:
    image: ${AGDI_IMAGE:-agdi:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      AGDI_GATEWAY_TOKEN: ${AGDI_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${AGDI_CONFIG_DIR}:/home/node/.agdi
      - ${AGDI_WORKSPACE_DIR}:/home/node/.agdi/workspace
    ports:
      - "${AGDI_GATEWAY_PORT:-18789}:18789"
      - "${AGDI_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${AGDI_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  agdi-cli:
    image: ${AGDI_IMAGE:-agdi:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      AGDI_GATEWAY_TOKEN: ${AGDI_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${AGDI_CONFIG_DIR}:/home/node/.agdi
      - ${AGDI_WORKSPACE_DIR}:/home/node/.agdi/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
