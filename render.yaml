services:
  - type: web
    name: agdi
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: AGDI_STATE_DIR
        value: /data/.agdi
      - key: AGDI_WORKSPACE_DIR
        value: /data/workspace
      - key: AGDI_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: agdi-data
      mountPath: /data
      sizeGB: 1
